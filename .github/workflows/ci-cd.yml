name: ci-cd
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native module and install dependencies
        run: |
          make -C native clean all
          pip install -r requirements.txt
      - name: Run ASAN and pytest security regression suite
        run: |
          ./native/poc_asan_fixed $(python3 -c 'print("A"*200)')
          pytest -v

  sast:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit SAST Gate (Fail on High/Critical)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json
          bandit -r src/ -ll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: bandit-report.json

  dast:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify container health & security headers
        run: |
          docker compose up -d --build
          sleep 5
          curl -sI http://localhost:5000/login | tee dast-headers-report.txt
          grep -i "X-Frame-Options: DENY" dast-headers-report.txt
          grep -i "Content-Security-Policy" dast-headers-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap-reports
          path: dast-headers-report.txt
